name: vidfetch

services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: vidfetch
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Persistent media inside the container.
      DOWNLOAD_DIR: /app/downloads
      FRONTEND_DIST: /app/frontend-dist
      DB_SCHEMA: ${DB_SCHEMA:-public}
      # Optional overrides; .env values take precedence for the rest.
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      MAX_CONCURRENT_JOBS_PER_USER: ${MAX_CONCURRENT_JOBS_PER_USER:-2}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-500}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - ./downloads:/app/downloads
    restart: unless-stopped
    stop_grace_period: 30s
