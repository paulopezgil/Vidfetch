name: vidfetch

# Local development stack.
#
#   docker compose up --build
#
# Starts the Vite frontend, the FastAPI backend, and a bundled PostgreSQL 16
# database. Everything runs from this repository: there is no external
# database project, CLI wrapper, or second Docker stack involved.
#
# Local accounts are stored in Postgres (`profiles` + `auth_sessions`). The
# `bootstrap` service creates the development administrator once the migrations
# have run; its credentials are public, disposable values.
#
# For a backend-only deployment see `docker-compose.backend.yml`, which is the
# canonical production Compose file.

services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  #
  # No host port is published on purpose: the backend reaches the database over
  # the Compose network, and a fixed host port is a common source of "port is
  # already allocated" failures. `docker compose exec db psql ...` works for
  # debugging.
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vidfetch-db
    environment:
      POSTGRES_DB: vidfetch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # One-shot migration runner
  #
  # Applies every `db/migrations/*.sql` file in filename order inside its own
  # transaction. For a custom schema, render the migrations first:
  #
  #   DB_SCHEMA=vidfetch python3 scripts/render_migrations.py
  #
  # then set DB_SCHEMA=vidfetch for the backend.
  # -------------------------------------------------------------------------
  migrate:
    image: postgres:16-alpine
    container_name: vidfetch-migrate
    environment:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vidfetch
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for path in $$(ls /migrations/*.sql | sort); do
          echo "applying $${path}"
          psql "$${DATABASE_URL}" -v ON_ERROR_STOP=1 -1 -f "$${path}"
        done
        echo "migrations complete"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # -------------------------------------------------------------------------
  # Local administrator bootstrap
  #
  # Creates admin@local.test / password123 as an approved administrator through
  # the backend CLI. Development convenience only: `docker-compose.backend.yml`
  # never runs it by default.
  # -------------------------------------------------------------------------
  bootstrap:
    build:
      context: ./backend
    container_name: vidfetch-bootstrap
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vidfetch
      DB_SCHEMA: public
      LOCAL_ADMIN_EMAIL: admin@local.test
      LOCAL_ADMIN_PASSWORD: password123
    command:
      - python
      - -m
      - backend.app.cli.create_admin
      - --email
      - ${LOCAL_ADMIN_EMAIL:-admin@local.test}
      - --password
      - ${LOCAL_ADMIN_PASSWORD:-password123}
      - --admin
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # -------------------------------------------------------------------------
  # Backend API + download worker
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: vidfetch-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vidfetch
      DB_SCHEMA: public
      # Local-development signing key, not a production secret.
      MEDIA_TOKEN_SECRET: local-dev-media-token-secret
      PUBLIC_API_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DOWNLOAD_DIR: /app/downloads
      MAX_CONCURRENT_DOWNLOADS: "2"
      MIN_FREE_DISK_MB: "100"
      ALLOW_PRIVATE_URLS: "false"
    volumes:
      - vidfetch_downloads:/app/downloads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Frontend (Vite dev server for HMR)
  #
  # The frontend authenticates against the FastAPI backend only; it never talks
  # to the database and needs no provider keys.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
    container_name: vidfetch-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  vidfetch_downloads:
