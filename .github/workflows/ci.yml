name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t vidfetch-backend ./backend
      - name: Build frontend image
        run: docker build -t vidfetch-frontend ./frontend
      - name: Validate local Compose file
        run: docker compose config -q
      - name: Validate backend-only Compose file
        # docker-compose.backend.yml reads deployment secrets from `.env`.
        # The template values are enough to validate the file structure and the
        # `env_file` wiring.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.backend.yml config -q

  migration-sql:
    name: Migration SQL syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pglast
        run: python -m pip install pglast
      - name: Check rendered public migrations
        run: python scripts/render_migrations.py --check
      - name: Parse migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import pglast

          paths = sorted(Path("db/migrations").glob("*.sql"))
          if not paths:
              raise SystemExit("No migrations found in db/migrations")
          for path in paths:
              pglast.parse_sql(path.read_text())
              print(f"parsed {path}")
          PY
      - name: Render and parse custom-schema migrations
        env:
          DB_SCHEMA: vidfetch
        run: |
          python scripts/render_migrations.py --output "$RUNNER_TEMP/vidfetch-migrations"
          python - <<'PY'
          import os
          from pathlib import Path

          import pglast

          output = Path(os.environ["RUNNER_TEMP"]) / "vidfetch-migrations"
          paths = sorted(output.glob("*.sql"))
          if not paths:
              raise SystemExit("No custom-schema migrations were rendered")

          for path in paths:
              text = path.read_text()
              if "{{" in text:
                  raise SystemExit(f"Unreplaced placeholder in {path}")
              pglast.parse_sql(text)
              print(f"parsed custom-schema {path}")
          PY

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vidfetch
        ports:
          - 5432:5432
        # Wait for the server to accept connections before running psql.
        options: >-
          --health-cmd "pg_isready -U postgres -d vidfetch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vidfetch
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for path in $(ls db/migrations/*.sql | sort); do
            echo "applying ${path}"
            psql -v ON_ERROR_STOP=1 -1 -f "${path}"
          done
      - name: Assert the local-auth and user-library tables exist
        run: |
          set -euo pipefail
          missing=0
          for table in profiles auth_sessions user_tracks user_playlists user_playlist_tracks; do
            if [ "$(psql -tAc "select to_regclass('public.${table}') is not null")" != "t" ]; then
              echo "missing table: public.${table}" >&2
              missing=1
            else
              echo "found table: public.${table}"
            fi
          done
          exit "${missing}"
      - name: Assert the local-auth columns exist
        run: |
          set -euo pipefail
          # Local auth keeps password hashes and token hashes in these tables;
          # they must exist as concrete columns after the baseline migration.
          columns="$(psql -tAc "select column_name from information_schema.columns
                                where table_schema = 'public'
                                  and table_name in ('profiles', 'auth_sessions')
                                order by column_name")"
          for column in password_hash token_hash expires_at; do
            if ! grep -qx "${column}" <<<"${columns}"; then
              echo "missing column: ${column}" >&2
              exit 1
            fi
          done
          echo "local-auth columns present"
      - name: Apply custom-schema migrations
        env:
          DB_SCHEMA: vidfetch
        run: |
          set -euo pipefail
          python3 scripts/render_migrations.py --output "$RUNNER_TEMP/vidfetch-migrations"
          for path in $(ls "$RUNNER_TEMP"/vidfetch-migrations/*.sql | sort); do
            echo "applying ${path}"
            psql -v ON_ERROR_STOP=1 -1 -f "${path}"
          done
          for table in profiles auth_sessions user_tracks user_playlists user_playlist_tracks; do
            if [ "$(psql -tAc "select to_regclass('vidfetch.${table}') is not null")" != "t" ]; then
              echo "missing table: vidfetch.${table}" >&2
              exit 1
            fi
          done
          echo "custom-schema migrations applied"
