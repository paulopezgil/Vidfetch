name: CI

on:
  push:
    branches: ["v2", "dev", "main"]
  pull_request:
    branches: ["v2", "dev", "main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  migration-sql:
    name: Migration SQL syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pglast
        run: python -m pip install pglast
      - name: Parse migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import pglast

          for path in sorted(Path("supabase/migrations").glob("*.sql")):
              pglast.parse_sql(path.read_text())
              print(f"parsed {path}")
          PY
