name: vidfetch-prod

# Production VPS stack: backend only.
#
# The frontend is deployed separately to Vercel; Supabase Cloud is managed
# externally. Put real values in `.env` and run:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Terminate TLS with Caddy/nginx in front of port 8000, and point
# PUBLIC_API_URL / CORS_ORIGINS at the public HTTPS origins.

services:
  backend:
    build:
      context: ./backend
    container_name: vidfetch-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - vidfetch_downloads:/app/downloads
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  vidfetch_downloads:
